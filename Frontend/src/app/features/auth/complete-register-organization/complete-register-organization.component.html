<main-navbar></main-navbar>

<div class="bg-[#e0f4ee]">
  <div class="container mx-auto p-4 relative h-[90vh]">
    <form class="grid grid-cols-1 md:grid-cols-2 h-auto gap-6 bg-[#fdfefe] rounded-2xl px-2">
      <h1 class="text-3xl text-center col-span-1 md:col-span-2 font-semibold py-5">Completa tu perfil para empezar esta experiencia</h1>

      <div class="flex justify-center flex-col items-center lg:items-start md:col-span-2 lg:gap-y-5">
      <h2 class="text-3xl col-span-1 md:col-span-2 font-semibold text-[#00765a] px-5">Organización</h2>
      <span class="text-lg col-span-1 md:col-span-2 px-5">Campo obligatorio <span class="text-red-700">*</span></span>
      </div>

      <!--Columna izquierda-->
      <div class="flex flex-col gap-4 p-0 lg:p-5 mb-[20px] lg:mb-[250px] xl:mb-0">
        <div class="flex items-center">
          <label class="font-medium w-1/3 text-[15px] lg:text-[16px]">Nombre de la organización <span class="text-red-700">*</span></label>
          <input class="border border-gray-300 rounded-lg p-2 flex-1" type="text" placeholder="Nombre de la organización" required>
        </div>

        <div class="flex items-center">
          <label class="font-medium w-1/3 text-[15px] lg:text-[16px]">Causa</label>
          <input class="border border-gray-300 rounded-lg p-2 flex-1" type="text" placeholder="Causa">
        </div>

        <div class="flex items-center">
          <label class="font-medium w-1/3 text-[15px] lg:text-[16px]">Fecha de fundación</label>
          <input class="border border-gray-300 rounded-lg p-2 flex-1" type="date" placeholder="Fecha de fundación">
        </div>

        <div class="flex items-center">
          <label class="font-medium w-1/3 text-[15px] lg:text-[16px]">País <span class="text-red-700">*</span></label>
          <input class="border border-gray-300 rounded-lg p-2 flex-1" type="text" placeholder="País">
        </div>

        <div class="flex items-center">
          <label class="font-medium w-1/3 text-[15px] lg:text-[16px]">Provincia <span class="text-red-700">*</span></label>
          <input class="border border-gray-300 rounded-lg p-2 flex-1" type="text" placeholder="Provincia/Estado">
        </div>

        <div class="flex items-center">
          <label class="font-medium w-1/3 text-[15px] lg:text-[16px]">Ciudad <span class="text-red-700">*</span></label>
          <input class="border border-gray-300 rounded-lg p-2 flex-1" type="text" placeholder="Ciudad">
        </div>

        <div class="flex items-center">
          <label class="font-medium w-1/3 text-[15px] lg:text-[16px]">Descripción <span class="text-red-700">*</span></label>
          <textarea class="border border-gray-300 rounded-lg p-2 flex-1" placeholder="Descripción"></textarea>
        </div>

        <div class="flex items-center">
          <label class="font-medium w-1/3 text-[15px] lg:text-[16px]">Email <span class="text-red-700">*</span></label>
          <input class="border border-gray-300 rounded-lg p-2 flex-1" type="email" placeholder="Email">
        </div>
      </div>

      <!--Columna derecha-->
      <div class="flex flex-col justify-center gap-4 lg:px-5 rounded-2xl mt-[-10px] md:mt-[-150px] lg:mt-[-200px] ">

        <!-- Contenedor para la imagen de perfil -->
        <div class="flex justify-center md:justify-end md:pr-5 md:mr-20 xl:mr-[200px] 2xl:mr-[240px] ">
          <div class="relative w-32 h-32 rounded-full overflow-hidden border-2 border-gray-300">
            <img [src]="profileImage" alt="Profile Image" class="w-full h-full object-cover">
            <input type="file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept="image/*" (change)="onFileSelected($event)">
          </div>
        </div>

        <div class="flex flex-col justify-center gap-4 border-1 p-5 rounded-2xl ">
          <div class="flex items-center">
            <label class="font-medium w-1/3 text-[15px] lg:text-[16px]">Teléfono <span class="text-red-700">*</span></label>
            <input class="border border-gray-300 rounded-lg p-2 flex-1" type="text" placeholder="Teléfono">
          </div>

          <div class="flex items-center">
            <label class="font-medium w-1/3 text-[15px] lg:text-[16px]">Dirección <span class="text-red-700">*</span></label>
            <input class="border border-gray-300 rounded-lg p-2 flex-1" type="text" placeholder="Dirección">
          </div>

          <div class="flex items-center">
            <label class="font-medium w-1/3 text-[15px] lg:text-[16px]">Código Postal <span class="text-red-700">*</span></label>
            <input class="border border-gray-300 rounded-lg p-2 flex-1" type="text" placeholder="Código Postal">
          </div>

          <div class="flex items-center">
            <label class="font-medium w-1/3 text-[15px] lg:text-[16px]">Sitio Web <span class="text-red-700">*</span></label>
            <input class="border border-gray-300 rounded-lg p-2 flex-1" type="text" placeholder="Sitio Web">
          </div>

          <div class="flex items-center">
            <label class="font-medium w-1/3 text-[15px] lg:text-[16px]">Redes Sociales <span class="text-red-700">*</span></label>
            <input class="border border-gray-300 rounded-lg p-2 flex-1" type="text" placeholder="Redes Sociales">
          </div>
        </div>
      </div>

      <div class="col-span-1 md:col-span-2 flex justify-end px-5 md:mt-[-80px] lg:mt-[-100px] mr-20 lg:mr-[20px]">
        <button class="w-[150px] bg-[#4285f3] h-[50px] my-3 flex items-center justify-center rounded-xl cursor-pointer relative overflow-hidden transition-all duration-500 ease-in-out shadow-md hover:scale-105 hover:shadow-lg before:absolute before:top-0 before:-left-full before:w-full before:h-full before:bg-gradient-to-r before:from-black before:to-black before:transition-all before:duration-500 before:ease-in-out before:z-[-1] before:rounded-xl hover:before:left-0 text-[#fff]">
          Guardar
        </button>
      </div>
      
    </form>
  </div>
</div>
